<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eunoia - Nexus Terminal</title>
  <style>
    :root {
      --bg-color: #050914;
      --panel-bg: rgba(16, 22, 38, 0.6);
      --border-glow: rgba(0, 243, 255, 0.3);
      --text-main: #e2e8f0;
      --text-dim: #8ba3b8;
      --accent-cyan: #00f3ff;
      --accent-purple: #bc13fe;
      --scan-line: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.2), transparent);
    }

    /* 白天模式变量覆盖 */
    body.light-theme {
      --bg-color: #f4f7fa;
      --panel-bg: rgba(255, 255, 255, 0.75);
      --border-glow: rgba(0, 188, 212, 0.4);
      --text-main: #1e293b;
      --text-dim: #64748b;
      --accent-cyan: #00acc1;
      --accent-purple: #8e24aa;
      --scan-line: linear-gradient(90deg, transparent, rgba(0, 172, 193, 0.15), transparent);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-color);
      background-image: 
        radial-gradient(circle at 50% 0%, #111a33 0%, transparent 50%),
        linear-gradient(0deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px;
      display: flex;
      justify-content: center;
      transition: background-color 0.4s ease, color 0.4s ease, background-image 0.4s ease;
    }

    body.light-theme {
      background-image: 
        radial-gradient(circle at 50% 0%, #e2e8f0 0%, transparent 50%),
        linear-gradient(0deg, rgba(0, 172, 193, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 172, 193, 0.03) 1px, transparent 1px);
    }

    .main-container {
      width: 100%;
      max-width: 1100px;
      position: relative;
    }

    /* 精美科幻风格白天/黑夜切换按钮 */
    .theme-toggle-btn {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      background: var(--panel-bg);
      border: 1px solid var(--border-glow);
      border-radius: 50%;
      color: var(--accent-cyan);
      font-size: 1.3em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 9999;
      user-select: none;
    }
    .theme-toggle-btn:hover {
      transform: scale(1.1) rotate(30deg);
      box-shadow: 0 0 20px var(--accent-cyan);
      border-color: var(--accent-cyan);
    }
    .theme-toggle-btn:active {
      transform: scale(0.95);
    }

    /* 头部科幻发光字 */
    .header {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }
    .header h1 {
      font-size: 1.8em;
      font-weight: 300;
      letter-spacing: 2px;
      color: var(--text-main);
      text-shadow: 0 0 10px var(--border-glow);
      font-family: "楷体", "KaiTi", serif;
      line-height: 1.5;
      transition: text-shadow 0.4s ease;
    }

    /* 搜索枢纽 */
    .search-nexus {
      display: flex;
      max-width: 650px;
      margin: 0 auto 40px;
      background: var(--panel-bg);
      border: 1px solid var(--border-glow);
      border-radius: 8px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.05);
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
    }
    .search-nexus::before {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 50%; height: 100%;
      background: var(--scan-line);
      animation: scan 3s infinite linear;
      pointer-events: none;
    }
    @keyframes scan {
      100% { left: 200%; }
    }
    .search-nexus select {
      background: transparent;
      color: var(--accent-cyan);
      border: none;
      border-right: 1px solid var(--border-glow);
      padding: 0 15px;
      font-size: 0.9em;
      outline: none;
      cursor: pointer;
      appearance: none;
      transition: all 0.4s ease;
    }
    .search-nexus select option { 
      background: var(--bg-color); 
      color: var(--text-main); 
    }
    .search-nexus input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 16px 20px;
      font-size: 1.1em;
      outline: none;
    }
    body.light-theme .search-nexus input::placeholder { color: #a0aec0; }
    body:not(.light-theme) .search-nexus input::placeholder { color: #4a5d73; }
    
    .search-nexus button {
      padding: 0 30px;
      background: transparent;
      color: var(--accent-cyan);
      border: none;
      border-left: 1px solid var(--border-glow);
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
    }
    .search-nexus button:hover {
      background: rgba(0, 243, 255, 0.08);
      box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2);
    }

    /* 面板基础样式 (玻璃拟态) */
    .glass-panel {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      margin-bottom: 30px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      transition: all 0.4s ease;
    }
    .panel-header {
      padding: 16px 24px;
      font-size: 1.1em;
      color: var(--accent-cyan);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: color 0.4s ease;
    }
    .add-btn {
      background: transparent;
      color: var(--text-dim);
      border: 1px dashed var(--text-dim);
      border-radius: 4px;
      padding: 4px 12px;
      font-size: 0.8em;
      cursor: pointer;
      transition: 0.3s;
    }
    .add-btn:hover {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px var(--border-glow);
    }

    /* 链接网格 */
    .link-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 15px;
      padding: 24px;
    }
    .link-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      padding: 16px 8px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.3s;
      position: relative;
    }
    .link-item:hover {
      background: rgba(0, 243, 255, 0.05);
      border-color: var(--border-glow);
      transform: translateY(-3px);
    }
    .link-icon {
      width: 48px;
      height: 48px;
      background: rgba(0,0,0,0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.05);
      transition: background 0.4s ease;
    }
    body.light-theme .link-icon {
      background: rgba(0,0,0,0.03);
    }
    .link-icon img {
      width: 28px;
      height: 28px;
      border-radius: 4px;
    }
    .link-name {
      font-size: 0.85em;
      color: var(--text-main);
      text-align: center;
      transition: color 0.4s ease;
    }
    .delete-btn {
      position: absolute;
      top: 5px; right: 5px;
      background: rgba(255, 50, 50, 0.2);
      color: #ff5555;
      border: none;
      border-radius: 50%;
      width: 20px; height: 20px;
      font-size: 12px;
      cursor: pointer;
      display: none;
    }
    .link-item:hover .delete-btn { display: block; }

    /* 笔记网格 */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
      padding: 24px;
    }
    .note-card {
      background: rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 16px;
      transition: all 0.3s;
      text-decoration: none;
      color: inherit;
      position: relative;
      border-left: 3px solid var(--accent-purple);
    }
    body.light-theme .note-card {
      background: rgba(0,0,0,0.02);
    }
    .note-card:hover {
      background: rgba(188, 19, 254, 0.04);
      border-color: rgba(188, 19, 254, 0.2);
      box-shadow: 0 0 15px rgba(188, 19, 254, 0.08);
    }
    .note-card h3 {
      font-size: 1em;
      margin-bottom: 8px;
      color: var(--text-main);
      transition: color 0.4s ease;
    }
    .note-card p {
      font-size: 0.85em;
      color: var(--text-dim);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 0.4s ease;
    }
    .note-date {
      display: block;
      margin-top: 12px;
      font-size: 0.75em;
      color: var(--text-dim);
      opacity: 0.6;
    }
    .note-card:hover .delete-btn { display: block; }

    .footer {
      text-align: center;
      color: var(--text-dim);
      opacity: 0.5;
      font-size: 0.8em;
      margin-top: 40px;
      transition: color 0.4s ease;
    }
    .footer a { color: var(--accent-cyan); text-decoration: none; }
  </style>
</head>
<body>

  <div class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()" title="切换明暗模式">🌙</div>

  <div class="main-container">
    <div class="header">
      <h1>博学之 审问之 慎思之<br>明辨之 笃行之</h1>
    </div>

    <div class="search-nexus">
      <select id="engineSelect">
        <option value="bing">Bing</option>
        <option value="google">Google</option>
        <option value="baidu">Baidu</option>
      </select>
      <input type="text" id="searchInput" placeholder="Initialize Search Sequence..." onkeydown="if(event.key==='Enter')executeSearch()">
      <button onclick="executeSearch()">SCAN</button>
    </div>

    <div class="glass-panel">
      <div class="panel-header">
        <span>常用网页</span>
        <button class="add-btn" onclick="addNewLink('websites')">+ Add Node</button>
      </div>
      <div class="link-grid" id="websites-grid"></div>
    </div>

    <div class="glass-panel">
      <div class="panel-header">
        <span>常用工具</span>
        <button class="add-btn" onclick="addNewLink('tools')">+ Add Tool</button>
      </div>
      <div class="link-grid" id="tools-grid"></div>
    </div>

    <div class="glass-panel">
      <div class="panel-header">
        <span>笔记文档</span>
        <input type="file" id="noteUploader" style="display: none;" accept=".txt,.md" onchange="handleNoteUpload(event)">
        <button class="add-btn" onclick="document.getElementById('noteUploader').click()">+ Upload File</button>
      </div>
      <div class="notes-grid" id="notes-grid"></div>
    </div>

    <div class="footer">
      @2026 · <a href="https://github.com/fsw1238" target="_blank">Eunoia Nexus</a> · SYSTEM ONLINE
    </div>
  </div>

  <script>
    // --- 初始默认数据 ---
    const defaultData = {
      websites: [
        { name: "马克思主义文库", url: "https://marxists.incn.tech", icon: "https://www.google.com/s2/favicons?domain=marxists.incn.tech&sz=64" },
        { name: "GitHub", url: "https://github.com", icon: "https://www.google.com/s2/favicons?domain=github.com&sz=64" },
        { name: "Cloudflare", url: "https://dash.cloudflare.com", icon: "https://www.google.com/s2/favicons?domain=cloudflare.com&sz=64" },
        { name: "哔哩哔哩", url: "https://www.bilibili.com", icon: "https://www.google.com/s2/favicons?domain=bilibili.com&sz=64" },
        { name: "抖音", url: "https://www.douyin.com", icon: "https://www.google.com/s2/favicons?domain=douyin.com&sz=64" },
        { name: "为道日损", url: "http://wdrs.uupan.net", icon: "https://www.google.com/s2/favicons?domain=uupan.net&sz=64" }
      ],
      tools: [
        { name: "Gemini", url: "https://gemini.google.com", icon: "https://www.google.com/s2/favicons?domain=gemini.google.com&sz=64" },
        { name: "ChatGPT", url: "https://chatgpt.com", icon: "https://www.google.com/s2/favicons?domain=chatgpt.com&sz=64" },
        { name: "DeepSeek", url: "https://chat.deepseek.com", icon: "https://www.google.com/s2/favicons?domain=deepseek.com&sz=64" },
        { name: "Kimi", url: "https://www.kimi.com", icon: "https://www.google.com/s2/favicons?domain=kimi.com&sz=64" },
        { name: "Greasy Fork", url: "https://greasyfork.org", icon: "https://www.google.com/s2/favicons?domain=greasyfork.org&sz=64" },
        { name: "CRX4", url: "https://www.crx4chrome.com", icon: "https://www.google.com/s2/favicons?domain=crx4chrome.com&sz=64" }
      ],
      notes: [
        { id: 1, title: "我的 UI 设计原则", desc: "整理了一些工作中常用的设计原则和检查清单...", date: "2026-05-10" },
        { id: 2, title: "前端学习路线 2026", desc: "从 HTML 到 React 的阶段学习路径与资源推荐。", date: "2026-04-28" },
        { id: 3, title: "本周待办清单", desc: "优化个人主页 / 完成两个组件设计 / 阅读《设计心理学》...", date: "2026-05-12" }
      ]
    };

    // --- 主题切换管理 ---
    function initTheme() {
      const savedTheme = localStorage.getItem('eunoia_theme') || 'dark';
      if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
        document.getElementById('themeToggle').innerHTML = '☀️';
      } else {
        document.body.classList.remove('light-theme');
        document.getElementById('themeToggle').innerHTML = '🌙';
      }
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-theme');
      localStorage.setItem('eunoia_theme', isLight ? 'light' : 'dark');
      document.getElementById('themeToggle').innerHTML = isLight ? '☀️' : '🌙';
    }

    // --- 数据初始化管理 ---
    function initData() {
      if (!localStorage.getItem('eunoia_data')) {
        localStorage.setItem('eunoia_data', JSON.stringify(defaultData));
      }
      renderAll();
    }

    function getData() {
      return JSON.parse(localStorage.getItem('eunoia_data'));
    }

    function saveData(data) {
      localStorage.setItem('eunoia_data', JSON.stringify(data));
      renderAll();
    }

    // --- 搜索引擎逻辑 ---
    const engineUrls = {
      bing: 'https://cn.bing.com/search?q=',
      google: 'https://www.google.com/search?q=',
      baidu: 'https://www.baidu.com/s?wd='
    };

    function executeSearch() {
      const query = document.getElementById('searchInput').value.trim();
      const engine = document.getElementById('engineSelect').value;
      if (query) {
        window.open(engineUrls[engine] + encodeURIComponent(query));
      }
    }

    // --- 动态添加书签 ---
    function addNewLink(category) {
      const url = prompt("请输入要添加的网址:");
      if (!url) return;
      const name = prompt("请输入网站名称:");
      if (!name) return;

      let domain = "";
      try {
        domain = new URL(url).hostname;
      } catch(e) {
        alert("网址格式不正确，请包含 http:// 或 https://");
        return;
      }
      
      const iconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
      const data = getData();
      data[category].push({ name, url, icon: iconUrl });
      saveData(data);
    }

    function deleteItem(category, index, event) {
      event.preventDefault();
      if(confirm("确认删除此节点吗？")) {
        const data = getData();
        data[category].splice(index, 1);
        saveData(data);
      }
    }

    // --- 动态读取本地文件笔记 ---
    function handleNoteUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const content = e.target.result;
        const desc = content.substring(0, 40).replace(/\\n/g, ' ') + '...';
        const today = new Date().toISOString().split('T')[0];
        
        const data = getData();
        data.notes.unshift({
          id: Date.now(),
          title: file.name,
          desc: desc,
          date: today,
          content: content
        });
        saveData(data);
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    function viewNote(index, event) {
      event.preventDefault();
      const data = getData();
      const note = data.notes[index];
      if(note.content) {
        alert(`【${note.title}】\\n\\n${note.content}`);
      } else {
        alert("具体内容请在代码中指向对应 Markdown 文件，或使用右侧按钮上传真实文本文件。");
      }
    }

    // --- 渲染页面 UI ---
    function renderAll() {
      const data = getData();
      
      ['websites', 'tools'].forEach(category => {
        const container = document.getElementById(`${category}-grid`);
        container.innerHTML = data[category].map((item, index) => `
          <a href="${item.url}" target="_blank" class="link-item">
            <button class="delete-btn" onclick="deleteItem('${category}', ${index}, event)">×</button>
            <div class="link-icon"><img src="${item.icon}" alt="${item.name}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiM4YmEzYjgiIHN0cm9rZS13aWR0aD0iMiI+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iMTAiLz48L3N2Zz4='"></div>
            <div class="link-name">${item.name}</div>
          </a>
        `).join('');
      });

      const notesContainer = document.getElementById('notes-grid');
      notesContainer.innerHTML = data.notes.map((note, index) => `
        <a href="#" onclick="viewNote(${index}, event)" class="note-card">
          <button class="delete-btn" onclick="deleteItem('notes', ${index}, event)">×</button>
          <h3>${note.title}</h3>
          <p>${note.desc}</p>
          <span class="note-date">${note.date}</span>
        </a>
      `).join('');
    }

    // 初始化加载
    window.onload = function() {
      initTheme();
      initData();
    };
  </script>
</body>
</html>
