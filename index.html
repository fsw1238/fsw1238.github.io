<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eunoia</title>
  <link rel="icon" type="image/png" href="icon/ICON.png">
  <style>
    :root {
      /* 优化：调高背景不透明度，代替原本极其消耗性能的毛玻璃效果 */
      --bg-color: #050914;
      --panel-bg: rgba(16, 22, 38, 0.95);
      --border-glow: rgba(0, 243, 255, 0.3);
      --text-main: #e2e8f0;
      --text-dim: #8ba3b8;
      --accent-cyan: #00f3ff;
      --accent-purple: #bc13fe;
    }

    /* 白天模式变量覆盖 */
    body.light-theme {
      --bg-color: #dddddd;
      --panel-bg: rgba(255, 255, 255, 0.95);
      /* 白天模式实体背景 */
      --border-glow: rgba(0, 0, 0, 0);
      --text-main: #1e293b;
      --text-dim: #64748b;
      --accent-cyan: #000000;
      --accent-purple: #8e24aa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-color);
      /* 优化：简化了背景图案的层级 */
      background-image:
        linear-gradient(0deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px;
      display: flex;
      justify-content: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body.light-theme {
      background-image:
        linear-gradient(0deg, rgba(0, 172, 193, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 172, 193, 0.03) 1px, transparent 1px);
    }

    .main-container {
      width: 100%;
      max-width: 1100px;
      position: relative;
    }

    /* 精美科幻风格白天/黑夜切换按钮 */
    .theme-toggle-btn {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      background: var(--panel-bg);
      border: 1px solid var(--border-glow);
      border-radius: 50%;
      color: var(--accent-cyan);
      font-size: 1.3em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 9999;
      user-select: none;
    }

    .theme-toggle-btn:hover {
      transform: scale(1.1);
      border-color: var(--accent-cyan);
    }

    .theme-toggle-btn:active {
      transform: scale(0.95);
    }

    /* 头部科幻发光字 */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 16px;
      letter-spacing: 2px;
      color: var(--text-main);
      text-shadow: 0 0 8px var(--border-glow);
      font-family: "楷体", "KaiTi", serif;
      line-height: 1.5;
    }

    /* 搜索枢纽 - 移除了动画和毛玻璃 */
    .search-nexus {
      display: flex;
      max-width: 650px;
      margin: 0 auto 40px;
      background: var(--panel-bg);
      border: 1px solid var(--border-glow);
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .search-nexus select {
      background: transparent;
      color: var(--accent-cyan);
      border: none;
      border-right: 1px solid var(--border-glow);
      padding: 0 15px;
      font-size: 0.9em;
      outline: none;
      cursor: pointer;
      appearance: none;
    }

    .search-nexus select option {
      background: var(--bg-color);
      color: var(--text-main);
    }

    .search-nexus input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 16px 20px;
      font-size: 1.1em;
      outline: none;
    }

    body.light-theme .search-nexus input::placeholder {
      color: #a0aec0;
    }

    body:not(.light-theme) .search-nexus input::placeholder {
      color: #4a5d73;
    }

    .search-nexus button {
      padding: 0 30px;
      background: transparent;
      color: var(--accent-cyan);
      border: none;
      border-left: 1px solid var(--border-glow);
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
    }

    .search-nexus button:hover {
      background: rgba(0, 243, 255, 0.08);
    }

    /* 面板基础样式 - 移除了毛玻璃 */
    .glass-panel {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }

    body.light-theme .glass-panel {
      border-color: rgba(0, 0, 0, 0.05);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
    }

    .panel-header {
      padding: 16px 24px;
      font-size: 1.1em;
      color: var(--accent-cyan);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    body.light-theme .panel-header {
      border-bottom-color: rgba(0, 0, 0, 0.05);
    }

    .add-btn {
      background: transparent;
      color: var(--text-dim);
      border: 1px dashed var(--text-dim);
      border-radius: 4px;
      padding: 4px 12px;
      font-size: 0.8em;
      cursor: pointer;
      transition: 0.3s;
    }

    .add-btn:hover {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    /* 链接网格 */
    .link-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 15px;
      padding: 24px;
    }

    .link-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      padding: 16px 8px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.2s;
      position: relative;
    }

    .link-item:hover {
      background: rgba(0, 243, 255, 0.05);
      border-color: var(--border-glow);
      transform: translateY(-2px);
    }

    .link-icon {
      width: 48px;
      height: 48px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    body.light-theme .link-icon {
      background: rgba(0, 0, 0, 0.03);
      border-color: rgba(0, 0, 0, 0.05);
    }

    .link-icon img {
      width: 28px;
      height: 28px;
      border-radius: 4px;
    }

    .link-name {
      font-size: 0.85em;
      color: var(--text-main);
      text-align: center;
    }

    .delete-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(255, 50, 50, 0.2);
      color: #ff5555;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 12px;
      cursor: pointer;
      display: none;
    }

    .link-item:hover .delete-btn {
      display: block;
    }

    /* 笔记网格 */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
      padding: 24px;
    }

    .note-card {
      background: rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 16px;
      transition: all 0.2s;
      text-decoration: none;
      color: inherit;
      position: relative;
      border-left: 3px solid var(--accent-purple);
    }

    body.light-theme .note-card {
      background: rgba(0, 0, 0, 0.02);
      border-color: rgba(0, 0, 0, 0.05);
    }

    .note-card:hover {
      background: rgba(188, 19, 254, 0.04);
      border-color: rgba(188, 19, 254, 0.2);
      transform: translateY(-2px);
    }

    .note-card h3 {
      font-size: 1em;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .note-card p {
      font-size: 0.85em;
      color: var(--text-dim);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .note-date {
      display: block;
      margin-top: 12px;
      font-size: 0.75em;
      color: var(--text-dim);
      opacity: 0.6;
    }

    .note-card:hover .delete-btn {
      display: block;
    }

    .footer {
      text-align: center;
      color: var(--text-dim);
      opacity: 0.5;
      font-size: 0.8em;
      margin-top: 40px;
    }

    .footer a {
      color: var(--accent-cyan);
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()" title="切换明暗模式">🌙</div>

  <div class="main-container">
    <div class="header">
      <h1>博学之 审问之 慎思之<br>明辨之 笃行之</h1>
    </div>

    <div class="search-nexus">
      <select id="engineSelect">
        <option value="bing">Bing</option>
        <option value="google">Google</option>
        <option value="baidu">Baidu</option>
        <option value="yandex">Yandex</option>
      </select>
      <input type="text" id="searchInput" placeholder="" onkeydown="if(event.key==='Enter')executeSearch()">
      <button onclick="executeSearch()">搜 索</button>
    </div>

    <div class="glass-panel">
      <div class="panel-header">
        <span>常用网页</span>
        <button class="add-btn" onclick="addNewLink('websites')">+ 添加网页</button>
      </div>
      <div class="link-grid" id="websites-grid"></div>
    </div>

    <div class="glass-panel">
      <div class="panel-header">
        <span>常用工具</span>
        <button class="add-btn" onclick="addNewLink('tools')">+ 添加工具</button>
      </div>
      <div class="link-grid" id="tools-grid"></div>
    </div>

    <div class="glass-panel">
      <div class="panel-header">
        <span>笔记文档</span>
        <input type="file" id="noteUploader" style="display: none;" accept=".txt,.md"
          onchange="handleNoteUpload(event)">
        <button class="add-btn" onclick="document.getElementById('noteUploader').click()">+ 上传文件</button>
      </div>
      <div class="notes-grid" id="notes-grid"></div>
    </div>

    <div class="footer">
      @2026 · <a href="https://github.com/fsw1238" target="_blank">Eunoia</a> · 保持更新
    </div>
  </div>

  <script>
    // --- 辅助方法：生成备用网络图标链接 ---
    // 只有当你没有提供本地图标时，才会调用这个网络接口作为兜底方案
    function getFavicon(url) {
      try {
        const domain = new URL(url).hostname;
        return `https://icons.duckduckgo.com/ip3/${domain}.ico`;
      } catch (e) {
        return "";
      }
    }

    // --- 初始默认数据 (恢复为本地icon路径) ---
    const defaultData = {
      websites: [
        { name: "马克思主义文库", url: "https://marxists.incn.tech/chinese/#:~:text=%E4%B8%AD%E6%96%87%E9%A9%AC%E5%85%8B%E6%80%9D%E4%B8%BB%E4%B9%89%E6%96%87,%E5%B7%A6%E7%BF%BC%E7%90%86%E8%AE%BA%E8%B5%84%E6%BA%90%E5%BA%93%E3%80%82", icon: "icon/marxists.svg" },
        { name: "GitHub", url: "https://github.com", icon: "icon/github.png" },
        { name: "Cloudflare", url: "https://dash.cloudflare.com/72753bd9b4081846f2d8b0994c34f70d/home/overview", icon: "icon/Cloudflare.svg" },
        { name: "哔哩哔哩", url: "https://www.bilibili.com", icon: "icon/bilibili.ico" },
        { name: "抖音", url: "https://www.douyin.com/?recommend=1", icon: "icon/douyin.png" },
        { name: "为道日损", url: "http://wdrs.uupan.net/", icon: "icon/wdrs.ico" }
      ],
      tools: [
        { name: "Gemini", url: "https://gemini.google.com/app", icon: "icon/Gemini.png" },
        { name: "ChatGPT", url: "https://chatgpt.com", icon: "icon/ChatGPT.webp" },
        { name: "DeepSeek", url: "https://chat.deepseek.com/", icon: "icon/DeepSeek.png" },
        { name: "Kimi", url: "https://www.kimi.com/?chat_enter_method=new_chat", icon: "icon/Kimi.png" },
        { name: "Greasy Fork", url: "https://greasyfork.org/zh-CN/scripts", icon: "icon/Greasy Fork.png" },
        { name: "CRX4", url: "https://www.crx4chrome.com/", icon: "icon/CRX4.jpg" },
        { name: "TubeDown", url: "https://tubedown.cn/youtube", icon: "icon/TubeDown.ico" }
      ],
      notes: [
        { id: 1, title: "我的 UI 设计原则", desc: "整理了一些工作中常用的设计原则和检查清单...", date: "2026-05-10", url: "pages/test.html" },
        { id: 2, title: "前端学习路线 2026", desc: "从 HTML 到 React 的阶段学习路径与资源推荐。", date: "2026-04-28", url: "texts/test.md" },
        { id: 3, title: "本周待办清单", desc: "优化个人主页 / 完成两个组件设计 / 阅读《设计心理学》...", date: "2026-05-12" },
        { id: 4, title: "读书笔记：《设计心理学》", desc: "第一章：人类行为的复杂性 / 第二章：设计中的心理模型...", date: "2026-05-15" }
      ]
    };

    // --- 主题切换管理 ---
    function initTheme() {
      const savedTheme = localStorage.getItem('eunoia_theme') || 'dark';
      if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
        document.getElementById('themeToggle').innerHTML = '☀️';
      } else {
        document.body.classList.remove('light-theme');
        document.getElementById('themeToggle').innerHTML = '🌙';
      }
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-theme');
      localStorage.setItem('eunoia_theme', isLight ? 'light' : 'dark');
      document.getElementById('themeToggle').innerHTML = isLight ? '☀️' : '🌙';
    }

    // --- 数据初始化管理 ---
    function initData() {
      localStorage.removeItem('eunoia_data'); // 开发阶段强制清除旧数据，正式使用时请注释掉这一行以保留用户数据
      if (!localStorage.getItem('eunoia_data')) {
        localStorage.setItem('eunoia_data', JSON.stringify(defaultData));
      }
      renderAll();
    }

    function getData() {
      return JSON.parse(localStorage.getItem('eunoia_data'));
    }

    function saveData(data) {
      localStorage.setItem('eunoia_data', JSON.stringify(data));
      renderAll();
    }

    // --- 搜索引擎逻辑 ---
    const engineUrls = {
      bing: 'https://cn.bing.com/search?q=',
      google: 'https://www.google.com/search?q=',
      baidu: 'https://www.baidu.com/s?wd=',
      yandex: 'https://yandex.com/search/?text='
    };

    function executeSearch() {
      const query = document.getElementById('searchInput').value.trim();
      const engine = document.getElementById('engineSelect').value;
      if (query) {
        window.open(engineUrls[engine] + encodeURIComponent(query));
      }
    }

    // --- 动态添加书签 (支持指定本地图标) ---
    function addNewLink(category) {
      const url = prompt("1. 请输入要添加的网址 (如: https://www.taobao.com):");
      if (!url) return;

      const name = prompt("2. 请输入网站名称 (如: 淘宝):");
      if (!name) return;

      // 新增：询问用户本地图标的文件名
      const localIcon = prompt("3. 请输入 icon 目录下的图标文件名 (如: taobao.png)。\n【注意】请确保你已经把图片放在了 icon 文件夹里。\n\n如果不想用本地图标，直接点击“确定”留空，系统会尝试从网络自动获取：");

      let finalIconUrl = "";
      if (localIcon && localIcon.trim() !== "") {
        // 如果用户输入了文件名，就拼接到 icon/ 目录下
        finalIconUrl = "icon/" + localIcon.trim();
      } else {
        // 如果留空，则使用备用的网络接口自动获取
        finalIconUrl = getFavicon(url);
      }

      const data = getData();
      data[category].push({ name, url, icon: finalIconUrl });
      saveData(data);
    }

    // --- 删除项目功能（加入防冒泡优化） ---
    function deleteItem(category, index, event) {
      event.preventDefault();  // 阻止基础标签默认行为
      event.stopPropagation(); // 核心核心：阻止事件冒泡！防止点击删除按钮时，错误地打开了卡片链接
      if (confirm("确认删除此节点吗？")) {
        const data = getData();
        data[category].splice(index, 1);
        saveData(data);
      }
    }

    // --- 动态读取本地文件笔记 ---
    function handleNoteUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const content = e.target.result;
        const desc = content.substring(0, 40).replace(/\n/g, ' ') + '...';
        const today = new Date().toISOString().split('T')[0];

        const data = getData();
        data.notes.unshift({
          id: Date.now(),
          title: file.name,
          desc: desc,
          date: today,
          content: content
        });
        saveData(data);
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    // --- 查看笔记逻辑分流 ---
    function viewNote(index, event) {
      const data = getData();
      const note = data.notes[index];

      // 分流逻辑一：如果在代码区域配置了真实文件的 url 路径
      if (note.url) {
        // 直接返回，允许 HTML 执行默认的超链接跳转，在新标签页打开文件
        return;
      }

      // 分流逻辑二：如果没有 url，说明是前端动态上传的
      event.preventDefault(); // 拦截页面跳转
      if (note.content) {
        alert(`【${note.title}】\n\n${note.content}`);
      } else {
        alert("未检测到文件内容或路径配置错误。");
      }
    }

    // --- 渲染页面 UI ---
    function renderAll() {
      const data = getData();

      // 破图兜底机制：如果本地没这个图片，或者网络获取失败，显示一个灰色小圆圈
      const fallbackSvg = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiM4YmEzYjgiIHN0cm9rZS13aWR0aD0iMiI+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iMTAiLz48L3N2Zz4=";

      ['websites', 'tools'].forEach(category => {
        const container = document.getElementById(`${category}-grid`);
        container.innerHTML = data[category].map((item, index) => `
          <a href="${item.url}" target="_blank" class="link-item">
            <button class="delete-btn" onclick="deleteItem('${category}', ${index}, event)">×</button>
            <div class="link-icon">
              <img src="${item.icon}" alt="${item.name}" onerror="this.src='${fallbackSvg}'">
            </div>
            <div class="link-name">${item.name}</div>
          </a>
        `).join('');
      });

      // 📝 渲染笔记列表
      const notesContainer = document.getElementById('notes-grid');
      notesContainer.innerHTML = data.notes.map((note, index) => {
        // 如果有 url 属性，超链接设为真实路径，否则设为 "#"
        const href = note.url ? note.url : "#";
        // 如果有 url 属性，在新标签页 (target="_blank") 打开该文件
        const target = note.url ? 'target="_blank"' : '';

        return `
          <a href="${href}" ${target} onclick="viewNote(${index}, event)" class="note-card">
            <button class="delete-btn" onclick="deleteItem('notes', ${index}, event)">×</button>
            <h3>${note.title}</h3>
            <p>${note.desc}</p>
            <span class="note-date">${note.date}</span>
          </a>
        `;
      }).join('');
    }

    // 初始化加载
    window.onload = function () {
      initTheme();
      initData();
    };
  </script>
</body>

</html>
